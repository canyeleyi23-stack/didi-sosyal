services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - didi_data:/app/data
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: didi_sosyal
      POSTGRES_USER: didi
      POSTGRES_PASSWORD: change_me
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
volumes:
  didi_data:
  pg_data:
